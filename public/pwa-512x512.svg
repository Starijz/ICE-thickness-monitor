<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ice" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)" />
  
  <!-- Ice Rink Outline -->
  <rect x="64" y="128" width="384" height="256" rx="80" fill="url(#ice)" stroke="#38bdf8" stroke-width="8" opacity="0.95" />
  
  <!-- Center Line & Circle -->
  <line x1="256" y1="128" x2="256" y2="384" stroke="#ef4444" stroke-width="8" />
  <circle cx="256" cy="256" r="54" stroke="#2563eb" stroke-width="6" fill="none" />
  
  <!-- Caliper / Measurement Arrow -->
  <g transform="translate(256, 256) scale(1.4)">
    <circle cx="0" cy="0" r="28" fill="#0f172a" stroke="#facc15" stroke-width="4" />
    <path d="M-12,-8 L12,-8 M-12,8 L12,8 M0,-14 L0,14" stroke="#38bdf8" stroke-width="4" stroke-linecap="round" />
  </g>
  
  <!-- Measurement Badge -->
  <rect x="176" y="324" width="160" height="42" rx="12" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  <text x="256" y="352" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="22" font-weight="900">38.5 mm</text>
</svg>
